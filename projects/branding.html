<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الشعارات والهويات البصرية | أسامة رامي</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .category-page{padding-top:55px;padding-bottom:90px}
    .category-back{display:inline-block;margin-bottom:28px;color:var(--muted)}
    .category-heading{margin-bottom:35px}
    .category-heading h1{font-size:clamp(30px,5vw,48px);line-height:1.6}
    .category-heading p{color:var(--muted);line-height:2}
    .brand-projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    .brand-project{display:block;color:inherit}
    .brand-project img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--card)}
    .brand-project h2{font-size:18px;margin-top:14px}
    @media(max-width:600px){.brand-projects{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="category-page section-shell">
    <a class="category-back" href="../index.html#work">← العودة للرئيسية</a>
    <header class="category-heading">
      <span class="eyebrow">BRAND PORTFOLIO</span>
      <h1>الشعارات والهويات البصرية</h1>
      <p>مجموعة من مشاريع تصميم الشعارات والهويات البصرية.</p>
    </header>

    <section class="brand-projects">
      <a class="brand-project" href="branding-01.html">
        <img src="../images/branding/IMG_20261026_212423_791.jpg"
             alt="واجهة مشروع هوية بصرية">
        <h2>مشروع الهوية البصرية الأول</h2>
      </a>
    </section>
  </main>
</body>
</html>
