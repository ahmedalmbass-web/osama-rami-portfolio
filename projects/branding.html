<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8F6F0">
  <title>الشعارات والهويات البصرية | أسامة رامي</title>
  <meta name="description" content="استكشف مشاريع تصميم الشعارات والهويات البصرية.">
  <link rel="stylesheet" href="../style.css">

  <style>
    .brand-page {
      padding-top: 55px;
      padding-bottom: 90px;
    }

    .brand-heading {
      margin-bottom: 35px;
    }

    .brand-heading h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.6;
      margin: 12px 0;
    }

    .brand-heading p {
      color: var(--muted);
      line-height: 2;
    }

    .brand-projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .brand-project {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .brand-project-cover {
      display: block;
      overflow: hidden;
      background: var(--card);
      aspect-ratio: 4 / 3;
    }

    .brand-project-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .3s ease;
    }

    .brand-project:hover img {
      transform: scale(1.03);
    }

    .brand-project h2 {
      font-size: 19px;
      margin: 15px 0 7px;
    }

    .project-index {
      color: var(--muted);
      font-size: 11px;
      direction: ltr;
      display: inline-block;
    }

    .empty-message {
      color: var(--muted);
      line-height: 2;
    }

    @media (max-width: 600px) {
      .brand-projects {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="brand-page section-shell">
    <a href="../index.html">← العودة إلى الرئيسية</a>

    <header class="brand-heading">
      <span class="eyebrow">BRANDING & IDENTITY</span>
      <h1>الشعارات والهويات البصرية</h1>
      <p>مجموعة من مشاريع تصميم الشعارات والهويات البصرية.</p>
    </header>

    <section class="brand-projects" id="brandProjects">
      <p class="empty-message">جارٍ تحميل المشاريع...</p>
    </section>
  </main>

  <script>
    const container = document.getElementById("brandProjects");

    fetch("../projects.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("تعذر تحميل المشاريع");
        }
        return response.json();
      })
      .then(data => {
        const projects = data.projects.filter(
          project => project.category === "branding"
        );

        container.replaceChildren();

        if (projects.length === 0) {
          const message = document.createElement("p");
          message.className = "empty-message";
          message.textContent = "لا توجد مشاريع مضافة حاليًا.";
          container.appendChild(message);
          return;
        }

        projects.forEach((project, index) => {
          const link = document.createElement("a");
          link.className = "brand-project";
          link.href =
            "branding-project.html?id=" +
            encodeURIComponent(project.id);

          const cover = document.createElement("span");
          cover.className = "brand-project-cover";

          const image = document.createElement("img");
          image.src = "../" + project.cover;
          image.alt = project.titleAr;
          image.loading = "lazy";

          cover.appendChild(image);

          const title = document.createElement("h2");
          title.textContent = project.titleAr;

          const number = document.createElement("span");
          number.className = "project-index";
          number.textContent =
            "PROJECT / " + String(index + 1).padStart(3, "0");

          link.append(cover, title, number);
          container.appendChild(link);
        });
      })
      .catch(() => {
        container.replaceChildren();

        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent =
          "تعذر تحميل المشاريع. تحقق من ملف projects.json.";
        container.appendChild(message);
      });
  </script>
</body>
</html>
