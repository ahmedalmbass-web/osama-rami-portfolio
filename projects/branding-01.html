  <link rel="stylesheet" href="../style.css">
  <style>
    .project-detail {
      padding-top: 65px;

    }

    .project-back {
      display: inline-flex;
      margin-bottom: 35px;
      color: var(--muted);
      font-size: 13px;
    }

    .project-detail-header {
      max-width: 760px;
      margin-bottom: 45px;
    }

    .project-detail-header h1 {

      line-height: 1.5;
    }

    .project-detail-header p {
      color: var(--muted);
      line-height: 2.2;
    }

    .project-detail-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .project-detail-gallery figure {
      overflow: hidden;
      background: var(--card);
    }

    .project-detail-gallery img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
      object-fit: contain;
    }

    .project-detail-gallery figcaption {
      padding: 12px 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .project-detail-note {
      margin-top: 25px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .project-detail-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
